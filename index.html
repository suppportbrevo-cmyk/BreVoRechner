<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BreVo-Rechner</title>
    
    <style>
        :root {
            --primary: #E2001A;
            --primary-dark: #B60015;
            --background: #f5f5f5;
            --surface: #ffffff;
            --text: #212121;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        .card {
            background: var(--surface);
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 35px;
        }

        .button {
            display: block;
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 18px;
            margin-bottom: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .button:hover {
            background: var(--primary-dark);
        }

        footer {
            margin-top: 25px;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">🚆</div>

        <h1>BreVo-Rechner</h1>

        <p class="subtitle">
            Informationen zur App
        </p>

        <button class="button"
                onclick="window.location.href='datenschutz.html'">
            📄 Datenschutzerklärung
        </button>

        <button class="button"
                onclick="window.location.href='impressum.html'">
            📑 Impressum
        </button>

    </div>

    <footer>
        BreVo-Rechner • Version 1.0.0
    </footer>

</div>

</body>
</html>
</body>
</html>
